    <style>
@keyframes qb-shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
}
.qb-skeleton {
    background: linear-gradient(90deg, rgba(128,128,128,0.12) 25%, rgba(128,128,128,0.24) 50%, rgba(128,128,128,0.12) 75%);
    background-size: 800px 100%;
    animation: qb-shimmer 1.5s ease-in-out infinite;
    border-radius: 3px;
}
.qb-skeleton-progress {
    height: 18px;
    border-radius: 9px;
}
.qb-skeleton-btn {
    height: 26px;
    border-radius: 4px;
    flex-shrink: 0;
}
.qb-skeleton-circle {
    border-radius: 50%;
    flex-shrink: 0;
}
    </style>
</head>
<body class="body" data-theme="defaulted">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
