name: CI

on:
  workflow_dispatch:
  push:
  pull_request:
    paths-ignore:
    - '**.md'

jobs:
  es-linter-for-ts:
    name: Dashboard TS
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v5

    - name: Install nodejs
      uses: actions/setup-node@v5
      with:
        node-version: 20

    - name: Install dependencies
      run: |
        cd setup/dashboard/ws || exit 1
        npm ci

    - name: Run linter
      run: |
          cd setup/dashboard/ws || exit 1
          npm run lint

  es-linter-for-js:
    name: Dashboard JS
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v5

    - name: Install nodejs
      uses: actions/setup-node@v5
      with:
        node-version: 20

    - name: Install dependencies
      run: |
        cd setup/dashboard || exit 1
        npm ci --legacy-peer-deps

    - name: Run linter
      run: |
          cd setup/dashboard || exit 1
          npm run lint

  shell-linter:
    name: Shell
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v5

    - name: Run linter
      uses: azohra/shell-linter@latest
      with:
        # todo: scripts in packages
        path: "onekey.sh,setup.sh,scripts/bump-version.sh,packages/system/auxiliary/qbEnsureNodejs,packages/system/auxiliary/qbEnsureWsGateway,packages/system/auxiliary/qbNginxProxyMigrate,packages/system/auxiliary/qbNormalizeRepo,packages/system/auxiliary/qbWsHealthCheck,packages/system/auxiliary/qbBackupPrune,packages/system/update/qbUpdateBackup,packages/system/update/qbUpdateRevert"

    - name: Check system script syntax
      run: bash scripts/check-system-script-syntax.sh

  python-linter:
    name: Python & packages
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.9"
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint with flake8
        run: uv run --locked flake8
      - name: Type-check with pyright
        if: ${{ !cancelled() }}
        run: uv run --locked pyright
      - name: Test repository lint rules
        if: ${{ !cancelled() }}
        run: uv run --locked pytest -q tests/lint
      - name: Check all package lifecycle scripts and templates
        if: ${{ !cancelled() }}
        run: python3 scripts/lint-package-scripts.py

  system-tests:
    name: System / ${{ matrix.group }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: setup
            paths: tests/setup
          - group: runtime
            paths: tests/runtime
          - group: operations
            paths: tests/backups tests/operations tests/repository tests/progress
    steps:
      - uses: actions/checkout@v5
      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.9"
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Run system tests
        run: uv run --locked pytest -v ${{ matrix.paths }}
