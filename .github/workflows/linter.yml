name: Linter

on:
  workflow_dispatch:
  push:
  pull_request:
    paths-ignore:
    - '**.md'

jobs:
  es-linter-for-ts:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install nodejs
      uses: actions/setup-node@v4
      with:
        node-version: 24
  
    - name: Install dependencies
      run: |
        cd setup/dashboard/ws || exit 1
        npm ci

    - name: Run linter
      run: |
          cd setup/dashboard/ws || exit 1
          npm run lint

    - name: Run tests
      run: |
          cd setup/dashboard/ws || exit 1
          npm test

    - name: Verify the committed dashboard bundle matches the sources
      run: |
          cd setup/dashboard/ws || exit 1
          npm run build
          if git diff --quiet -- dist/server.js; then
            echo "dist/server.js is up to date."
            exit 0
          fi
          echo "::error file=setup/dashboard/ws/dist/server.js::dist/server.js is out of date: rebuild it and commit the artifact."
          git diff --numstat -- dist/server.js
          echo "committed size: $(git show :dist/server.js | wc -c | tr -d ' ') bytes"
          echo "rebuilt size:   $(wc -c < dist/server.js | tr -d ' ') bytes"
          echo "Run 'npm run build' in setup/dashboard/ws and commit the result." >&2
          exit 1

  es-linter-for-js:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install nodejs
      uses: actions/setup-node@v4
      with:
        node-version: 24
  
    - name: Install dependencies
      run: |
        cd setup/dashboard || exit 1
        npm ci --legacy-peer-deps

    - name: Run linter
      run: |
          cd setup/dashboard || exit 1
          npm run lint

  shell-linter:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Run linter
      uses: azohra/shell-linter@latest
      with:
        # todo: scripts in packages
        path: "onekey.sh,setup.sh,bump-version.sh,packages/system/auxiliary/qbEnsureNodejs,packages/system/auxiliary/qbEnsureWsGateway,packages/system/auxiliary/qbNginxProxyMigrate,packages/system/auxiliary/qbNormalizeRepo,packages/system/auxiliary/qbWsHealthCheck,packages/system/auxiliary/qbBackupPrune,packages/system/update/qbUpdateBackup,packages/system/update/qbUpdateRevert"

    - name: Check system script syntax
      run: bash scripts/check-system-script-syntax.sh

  package-script-linter:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Check all package lifecycle scripts and templates
      run: python3 scripts/lint-package-scripts.py
    - name: Test package script lint rules
      run: python3 tests/system/package-scripts-lint-test.py
    - name: Check tracked file modes and line endings
      run: python3 scripts/lint-repo-files.py
    - name: Test the repository normalizer
      run: python3 tests/system/repo-normalize-sandbox.py

  python-linter:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pipenv
        run: |
          python -m pip install --upgrade pipenv wheel
      - id: env-version
        run: |
          echo "python=$(python -c 'import platform;print(platform.python_version())')" >> "$GITHUB_OUTPUT"
          echo "ubuntu=$(lsb_release -cs)" >> "$GITHUB_OUTPUT"
      - id: cache-pipenv
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ steps.env-version.outputs.ubuntu }}-${{ steps.env-version.outputs.python }}-pipenv-${{ hashFiles('**/Pipfile.lock') }}
      - name: Install dependencies
        if: steps.cache-pipenv.outputs.cache-hit != 'true'
        run: |
          pipenv install --deploy --dev
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          pipenv run flake8

  dashboard-changes:
    name: Select Dashboard acceptance
    if: github.event_name != 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check application and acceptance paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- \
            setup.sh setup packages/system \
            packages/package/install/installpackage-authelia \
            packages/package/install/installpackage-vouchproxy \
            packages/package/install/installpackage-flood \
            tests e2e \
            .github/workflows/deployment.yml .github/workflows/linter.yml \
            > "$RUNNER_TEMP/dashboard-changes.txt"
          if [[ -s "$RUNNER_TEMP/dashboard-changes.txt" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

  dashboard-acceptance:
    name: Dashboard acceptance
    needs:
      - es-linter-for-ts
      - es-linter-for-js
      - shell-linter
      - package-script-linter
      - python-linter
      - dashboard-changes
    if: ${{ success() && needs.dashboard-changes.outputs.run == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/deployment.yml
