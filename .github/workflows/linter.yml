name: Linter

on:
  push:
  pull_request:
    paths-ignore:
    - '**.md'

jobs:
  es-linter-for-ts:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install nodejs
      uses: actions/setup-node@v4
      with:
        node-version: 20
  
    - name: Install dependencies
      run: |
        cd setup/dashboard/ws || exit 1
        npm ci

    - name: Run linter
      run: |
          cd setup/dashboard/ws || exit 1
          npm run lint

    - name: Run tests
      run: |
          cd setup/dashboard/ws || exit 1
          npm test

    - name: Verify the committed dashboard bundle matches the sources
      run: |
          cd setup/dashboard/ws || exit 1
          npm run build
          git diff --exit-code -- dist/server.js || {
            echo "dist/server.js is out of date: rebuild it and commit the artifact." >&2
            exit 1
          }

  es-linter-for-js:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install nodejs
      uses: actions/setup-node@v4
      with:
        node-version: 20
  
    - name: Install dependencies
      run: |
        cd setup/dashboard || exit 1
        npm ci --legacy-peer-deps

    - name: Run linter
      run: |
          cd setup/dashboard || exit 1
          npm run lint

  shell-linter:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Run linter
      uses: azohra/shell-linter@latest
      with:
        # todo: scripts in packages
        path: "onekey.sh,setup.sh,bump-version.sh,packages/system/auxiliary/qbEnsureWsGateway,packages/system/auxiliary/qbNginxProxyMigrate,packages/system/auxiliary/qbWsHealthCheck"

    - name: Check dashboard system script syntax
      shell: bash
      run: |
        set -euo pipefail
        # The dashboard deployment path is shell heavy: at minimum every script
        # changed by the dashboard review must stay syntactically valid.
        bash -n setup.sh
        for script in packages/system/box packages/system/qbUpdate packages/system/update/qbUpdateDashboard \
          packages/package/install/installpackage-vouchproxy \
          packages/system/update/qbUpdateRepo packages/system/update/qbUpdateService \
          packages/system/theme/themeSelect-defaulted packages/system/theme/themeSelect-smoked \
          packages/system/auxiliary/qbEnsureWsGateway packages/system/auxiliary/qbNginxProxyMigrate \
          packages/system/auxiliary/qbWsHealthCheck packages/system/auxiliary/qbNginxAuth; do
          bash -n "${script}"
        done

    - name: Exercise dashboard deployment failures in a sandbox
      shell: bash
      run: |
        set -euo pipefail
        bash tests/system/dashboard-stage-sandbox.sh
        python3 tests/system/qb-ensure-ws-gateway-sandbox.py
        python3 tests/system/dashboard-update-sandbox.py

  python-linter:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install pipenv
        run: |
          python -m pip install --upgrade pipenv wheel
      - id: env-version
        run: |
          echo "python=$(python -c 'import platform;print(platform.python_version())')" >> $GITHUB_OUTPUT
          echo "ubuntu=$(lsb_release -cs)" >> $GITHUB_OUTPUT
      - id: cache-pipenv
        uses: actions/cache@v3
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ steps.env-version.outputs.ubuntu }}-${{ steps.env-version.outputs.python }}-pipenv-${{ hashFiles('**/Pipfile.lock') }}
      - name: Install dependencies
        if: steps.cache-pipenv.outputs.cache-hit != 'true'
        run: |
          pipenv install --deploy --dev
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          pipenv run flake8
