name: CI

on:
  workflow_dispatch:
  push:
  pull_request:
    paths-ignore:
    - '**.md'

jobs:
  es-linter-for-ts:
    name: Dashboard TS
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install nodejs
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: setup/dashboard/ws/package-lock.json
  
    - name: Install dependencies
      run: |
        cd setup/dashboard/ws || exit 1
        npm ci

    - name: Run linter
      run: |
          cd setup/dashboard/ws || exit 1
          npm run lint

    - name: Run tests
      run: |
          cd setup/dashboard/ws || exit 1
          npm test

    - name: Verify the committed dashboard bundle matches the sources
      run: |
          cd setup/dashboard/ws || exit 1
          npm run build
          NODE_ENV=test node -e "require('./dist/server.js'); process.exit(0)"
          if git diff --quiet -- dist && [ -z "$(git ls-files --others --exclude-standard -- dist)" ]; then
            echo "Dashboard build artifacts are up to date."
            exit 0
          fi
          echo "::error::Dashboard build artifacts are out of date. Run 'npm run build' in setup/dashboard/ws and commit all changes in dist/."
          git status --short -- dist
          git diff --stat -- dist
          exit 1

  es-linter-for-js:
    name: Dashboard JS
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install nodejs
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: setup/dashboard/package-lock.json
  
    - name: Install dependencies
      run: |
        cd setup/dashboard || exit 1
        npm ci --legacy-peer-deps

    - name: Run linter
      run: |
          cd setup/dashboard || exit 1
          npm run lint

  shell-linter:
    name: Shell
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Run linter
      uses: azohra/shell-linter@latest
      with:
        # todo: scripts in packages
        path: "onekey.sh,setup.sh,scripts/bump-version.sh,packages/system/auxiliary/qbEnsureNodejs,packages/system/auxiliary/qbEnsureWsGateway,packages/system/auxiliary/qbNginxProxyMigrate,packages/system/auxiliary/qbNormalizeRepo,packages/system/auxiliary/qbWsHealthCheck,packages/system/auxiliary/qbBackupPrune,packages/system/update/qbUpdateBackup,packages/system/update/qbUpdateRevert"

    - name: Check system script syntax
      run: bash scripts/check-system-script-syntax.sh

  python-linter:
    name: Python & packages
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v10.3.2
        with:
          # Keep in sync with the uv release that wrote uv.lock.
          version: "0.12.9"
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint with flake8
        # No path argument: .flake8 owns the scope, and its exclude list keeps
        # .venv, node_modules and vendor out of the run.
        run: uv run --locked flake8
      - name: Type-check with pyright
        if: ${{ !cancelled() }}
        # pyrightconfig.json is shared with Pylance, so CI and the editor agree
        # on the file set and the checking mode.
        run: uv run --locked pyright
      - name: Check all package lifecycle scripts and templates
        if: ${{ !cancelled() }}
        run: python3 scripts/lint-package-scripts.py
      - name: Test package and repository lint rules
        if: ${{ !cancelled() }}
        run: uv run --locked pytest -q tests/lint
      - name: Check tracked file modes and line endings
        if: ${{ !cancelled() }}
        run: python3 scripts/lint-repo-files.py

  system-tests:
    name: System / ${{ matrix.group }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: setup
            paths: tests/setup
          - group: dashboard
            paths: tests/runtime tests/dashboard
          - group: operations
            paths: tests/backups tests/linux tests/operations tests/repository tests/progress tests/deployment/test_acceptance.py
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.9"
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: Check Docker availability
        run: docker info > /dev/null
      - name: Run system tests
        run: uv run --locked pytest -v ${{ matrix.paths }}

  dashboard-changes:
    name: Select acceptance
    if: github.event_name != 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check application and acceptance paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- \
            setup.sh setup packages/system \
            packages/package/install/installpackage-authelia \
            packages/package/install/installpackage-vouchproxy \
            packages/package/install/installpackage-flood \
            tests e2e \
            .github/workflows/deployment.yml .github/workflows/linter.yml \
            > "$RUNNER_TEMP/dashboard-changes.txt"
          if [[ -s "$RUNNER_TEMP/dashboard-changes.txt" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

  dashboard-acceptance:
    name: Acceptance
    needs: dashboard-changes
    if: ${{ needs.dashboard-changes.outputs.run == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/deployment.yml
