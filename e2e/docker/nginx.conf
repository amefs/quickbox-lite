server {
    listen 80;
    server_name localhost;

    root /srv/dashboard;
    index index.php;

    # Disable caching for testing
    add_header Cache-Control "no-store, no-cache, must-revalidate";

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|map)$ {
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?q=$uri&$args;
        index index.php;

        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /srv/dashboard$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT /srv/dashboard;
            fastcgi_param REMOTE_USER testuser;
            fastcgi_read_timeout 240;
        }

        location ^~ /db/ {
            # Allow access without auth in test mode
        }
        location ^~ /db/master.txt {
            return 404;
        }
        location ^~ /db/interface.txt {
            return 404;
        }

        location /ws {
            proxy_pass http://ws:8575;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            rewrite ^/ws/(.*) /$1 break;
        }
    }
}
