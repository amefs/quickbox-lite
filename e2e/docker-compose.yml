services:
  dashboard-init:
    image: alpine:3.21
    command:
      - /bin/sh
      - -lc
      - |
        mkdir -p /srv/dashboard
        cp -a /src/setup/dashboard/. /srv/dashboard/
        rm -rf /srv/dashboard/node_modules /srv/dashboard/ws/node_modules
        rm -f /srv/dashboard/skins/quick.css
        cp -a /src/setup/themes/smoked/skins/. /srv/dashboard/skins/
        mkdir -p /srv/dashboard/db/session_5sec
        if [ ! -f /srv/dashboard/.e2e_initialized ]; then
          cp -a /src/setup/dashboard/db/. /srv/dashboard/db/
        fi
        printf '%s\n' "${E2E_USER:-testuser}" > /srv/dashboard/db/master.txt
        printf '%s\n' "${E2E_IFACE:-eth0}" > /srv/dashboard/db/interface.txt
        : > /srv/dashboard/db/output.log
        : > /srv/dashboard/db/.smoked.lock
        touch /srv/dashboard/.e2e_initialized
    volumes:
      - ../setup:/src/setup:ro
      - dashboard-root:/srv/dashboard
      - php-db:/srv/dashboard/db
    networks:
      - e2e

  nginx:
    image: nginx:alpine
    ports:
      - "${E2E_PORT:-8880}:80"
    volumes:
      - dashboard-root:/srv/dashboard:ro
      - php-db:/srv/dashboard/db:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Override info.system.php with mock version
      - ./docker/mock/info.system.php:/srv/dashboard/inc/info.system.php:ro
    depends_on:
      dashboard-init:
        condition: service_completed_successfully
      ws:
        condition: service_healthy
      php:
        condition: service_started
    networks:
      - e2e

  php:
    build:
      context: ./docker
      dockerfile: Dockerfile.php
    entrypoint: ["/bin/sh", "/docker/php-entrypoint.sh"]
    volumes:
      - dashboard-root:/srv/dashboard
      - ../setup:/src/setup:ro
      # Override info.system.php with mock version
      - ./docker/mock/info.system.php:/srv/dashboard/inc/info.system.php:ro
      # Entrypoint script
      - ./docker/php-entrypoint.sh:/docker/php-entrypoint.sh:ro
      # Writable db dir (overlay mock data on top)
      - php-db:/srv/dashboard/db
    depends_on:
      dashboard-init:
        condition: service_completed_successfully
    networks:
      - e2e

  ws:
    image: node:22-slim
    working_dir: /srv/dashboard/ws
    environment:
      - NODE_ENV=test
      - MOCK_ENABLED=1
      - MOCK_PROFILE=${MOCK_PROFILE:-partial-running}
      - WS_HOST=0.0.0.0
      - WS_PORT=8575
    command:
      - /bin/sh
      - -lc
      - |
        if [ ! -d node_modules ] || \
           [ ! -d node_modules/tsx ] || \
           [ ! -f node_modules/express/package.json ] || \
           [ ! -f node_modules/body-parser/package.json ] || \
           [ ! -f node_modules/raw-body/package.json ] || \
           [ ! -f node_modules/iconv-lite/lib/index.js ] || \
           [ ! -f node_modules/iconv-lite/encodings/index.js ]; then
          rm -rf node_modules
          npm ci
        fi
        exec npx tsx src/server.tsx
    volumes:
      - dashboard-root:/srv/dashboard
      - php-db:/srv/dashboard/db
      - ws-node-modules:/srv/dashboard/ws/node_modules
    depends_on:
      dashboard-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const req = http.request({hostname:'127.0.0.1',port:8575,path:'/',method:'GET',timeout:2000}, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.end();\""]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - e2e

  playwright:
    image: mcr.microsoft.com/playwright:v1.52.0-jammy
    working_dir: /tests
    environment:
      - E2E_BASE_URL=http://nginx
      - WS_BASE_URL=http://ws:8575
    volumes:
      - ./:/tests
    depends_on:
      nginx:
        condition: service_started
    networks:
      - e2e
    profiles:
      - test

volumes:
  dashboard-root:
  ws-node-modules:
    name: ${WS_NODE_MODULES_VOLUME:-quickbox-e2e-ws-node-modules}
  php-db:

networks:
  e2e:
    driver: bridge
