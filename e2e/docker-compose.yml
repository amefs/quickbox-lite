services:
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${E2E_PORT:-8880}:80"
    environment:
      TEST_WS_PORT: "${TEST_WS_PORT:-8575}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/templates/default.conf.template:ro
